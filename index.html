<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bunny Breakfast Shop</title>
    <style>
        body { margin: 0; padding: 20px; background-color: #fef3e6; font-family: Arial, sans-serif; text-align: center; }
        .section { max-width: 960px; margin: 40px auto; padding: 20px; background: white; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .storyboard-img, video { max-width: 100%; border-radius: 8px; }
        h1 { color: #d27954; }
        h2 { color: #666; border-bottom: 2px solid #fef3e6; padding-bottom: 10px; }
        #unity-container { width: 960px; height: 600px; margin: 0 auto; position: relative; background: #000; border-radius: 8px; overflow: hidden; }
        #unity-canvas { width: 100%; height: 100%; }
        #loadProgress { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 20px; }
    </style>
</head>
<body>

    <h1>🐰 Bunny Breakfast Shop Project</h1>

    <div class="section">
        <h2>Storyboard: Bunny Breakfast Shop Tasks</h2>
        <img src="./bunny_storyboard.png" class="storyboard-img" alt="Storyboard">
    </div>

    <div class="section">
        <h2>Story Animation: Bunny's Breakfast Task</h2>
        <video controls>
            <source src="./bunny_video.mp4" type="video/mp4">
            Your browser does not support playback.
        </video>
    </div>

    <div class="section">
        <h2>3. Interactive 3D Experience</h2>
        <div id="unity-container">
            <canvas id="unity-canvas"></canvas>
            <div id="loadProgress">Loading... 0%</div>
        </div>
    </div>

    <script src="./Build/Build.loader.js"></script>
    <script>
        var canvas = document.querySelector("#unity-canvas");
        var loadingText = document.querySelector("#loadProgress");

        var config = {
            dataUrl: "Build/Build.data",
            frameworkUrl: "Build/Build.framework.js",
            codeUrl: "Build/Build.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "BunnyGame",
            productVersion: "0.1",
        };

        createUnityInstance(canvas, config, (progress) => {
            loadingText.innerHTML = "Loading... " + Math.round(100 * progress) + "%";
        }).then((unityInstance) => {
            loadingText.style.display = "none";
        }).catch((message) => {
            alert(message);
        });
    </script>
</body>
</html>

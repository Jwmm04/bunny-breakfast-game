<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bunny Breakfast Shop - Full </title>
    <style>
        body { margin: 0; padding: 20px; background-color: #fef3e6; font-family: Arial, sans-serif; text-align: center; }
        .content-box { max-width: 960px; margin: 30px auto; padding: 20px; background: white; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #d27954; border-bottom: 2px solid #fef3e6; padding-bottom: 10px; }
        img, video { max-width: 100%; border-radius: 8px; }
        /* 游戏区域的容器 */
        .game-container { width: 100%; height: 600px; border: none; border-radius: 8px; }
    </style>
</head>
<body>

    <h1>🐰 Bunny Breakfast Shop</h1>

    <div class="content-box">
        <h2>Storyboard</h2>
        <img src="bunny_storyboard.png" alt="Storyboard">
    </div>

    <div class="content-box">
        <h2>Demo Video</h2>
        <video controls>
            <source src="bunny_video.mp4" type="video/mp4">
            Your browser does not support video.
        </video>
    </div>

    <div class="content-box">
        <h2>3D Interactive Game</h2>
        <iframe src="game.html" class="game-container"></iframe>
    </div>

</body>
</html>

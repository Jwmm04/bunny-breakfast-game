<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bunny Breakfast Shop</title>
    <!-- 引入TemplateData样式（必须保留） -->
    <link rel="stylesheet" href="./TemplateData/style.css">
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #fef3e6;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .game-section {
            max-width: 960px;
            margin: 30px auto;
        }
        #unity-container {
            width: 960px;
            height: 600px;
            margin: 0 auto;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
        }
        h1 {
            color: #d27954;
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        #loadProgress {
            font-size: 18px;
            margin: 10px 0;
            color: #333;
        }
    </style>
</head>
<body>
    <h1>Bunny Breakfast Shop</h1>

    <!-- Unity游戏容器 -->
    <div class="game-section">
        <div id="unity-container">
            <div id="unity-loader"><div id="loadProgress">Game Loading: 0%</div></div>
            <div id="unity-canvas"></div>
        </div>
    </div>

    <!-- 加载Unity依赖脚本（顺序不能改） -->
    <script src="./TemplateData/UnityProgress.js"></script>
    <script src="./Build/Bunny_FINAL.loader.js"></script>
    <script>
        // 匹配当前Build文件夹的文件名称
        var config = {
            dataUrl: "./Build/Bunny_FINAL.data",
            frameworkUrl: "./Build/Bunny_FINAL.framework.js",
            codeUrl: "./Build/Bunny_FINAL.wasm",
            streamingAssetsUrl: "./StreamingAssets",
            companyName: "DefaultCompany",
            productName: "BunnyBreakfastGame",
            productVersion: "0.1",
            // 显示加载进度
            onProgress: function(progress) {
                document.getElementById('loadProgress').innerText = `Game Loading: ${Math.round(progress * 100)}%`;
            }
        };
        // 实例化Unity游戏
        var unityInstance = UnityLoader.instantiate("unity-canvas", "./Build/Bunny_FINAL.json", config);
    </script>
</body>
</html>
